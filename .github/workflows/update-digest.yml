name: Update Base Image Digest

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-digest:
    name: Check & Update Fedora Digest
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AETHERPAK_ACTION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.AETHERPAK_ACTION_BOT_APP_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Get GitHub App User ID
        id: get-user-id
        run: |
          set -euo pipefail
          USER_ID=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
          echo "user-id=$USER_ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Get Latest Fedora Minimal Digest
        id: get-digest
        run: |
          set -euo pipefail
          LATEST_DIGEST=$(skopeo inspect --raw docker://registry.fedoraproject.org/fedora-minimal:latest | sha256sum | awk '{print "sha256:" $1}')
          echo "latest=$LATEST_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Get Current Fedora Minimal Digest
        id: current-digest
        run: |
          set -euo pipefail
          CURRENT_DIGEST=$(sed -n 's/^ARG FEDORA_DIGEST=//p' Containerfile | tr -d '[:space:]')
          echo "current=$CURRENT_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Update Digest in Containerfile
        if: steps.get-digest.outputs.latest != steps.current-digest.outputs.current
        run: |
          set -euo pipefail
          sed -i "s|^ARG FEDORA_DIGEST=.*|ARG FEDORA_DIGEST=${{ steps.get-digest.outputs.latest }}|" Containerfile

      - name: Create Pull Request
        if: steps.get-digest.outputs.latest != steps.current-digest.outputs.current
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "ci: update Fedora minimal base digest to ${{ steps.get-digest.outputs.latest }}"
          committer: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          author: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          signoff: false
          branch: bump-fedora-digest
          delete-branch: true
          title: "ci: update Fedora minimal base digest to ${{ steps.get-digest.outputs.latest }}"
          body: |
            Updates `FEDORA_DIGEST` in `Containerfile` to the latest `registry.fedoraproject.org/fedora-minimal:latest` image digest.

            - **Previous Digest**: `${{ steps.current-digest.outputs.current }}`
            - **New Digest**: `${{ steps.get-digest.outputs.latest }}`

            Automatically generated by the Update Base Image Digest workflow.
          labels: |
            dependencies
            automated pr
